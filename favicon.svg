<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background tile -->
  <rect width="32" height="32" rx="7" fill="#1E1A16"/>
  <!-- Chimney -->
  <rect x="21" y="7" width="4" height="9" rx="1" fill="#8C4A22"/>
  <!-- Roof -->
  <polygon points="16,4 30,17 2,17" fill="#C8702A"/>
  <!-- Roof edge highlight -->
  <polygon points="16,4 30,17 28,17 16,6 4,17 2,17" fill="#E8934A"/>
  <!-- House walls -->
  <rect x="4" y="16" width="24" height="13" rx="1" fill="#FAF7F2"/>
  <!-- Left window -->
  <rect x="7" y="19" width="6" height="5" rx="1" fill="#5F8269"/>
  <line x1="10" y1="19" x2="10" y2="24" stroke="#FAF7F2" stroke-width=".8"/>
  <line x1="7" y1="21.5" x2="13" y2="21.5" stroke="#FAF7F2" stroke-width=".8"/>
  <!-- Right window -->
  <rect x="19" y="19" width="6" height="5" rx="1" fill="#5F8269"/>
  <line x1="22" y1="19" x2="22" y2="24" stroke="#FAF7F2" stroke-width=".8"/>
  <line x1="19" y1="21.5" x2="25" y2="21.5" stroke="#FAF7F2" stroke-width=".8"/>
  <!-- Door -->
  <rect x="13" y="21" width="6" height="8" rx="1" fill="#1E1A16"/>
  <!-- Door knob -->
  <circle cx="18" cy="25.5" r=".8" fill="#C8702A"/>
</svg>
